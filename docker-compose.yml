services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-published}
      POSTGRES_USER: ${POSTGRES_USER:-published}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-published}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-published}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5436:5432"

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: ${POSTGRES_DB:-published}
      POSTGRES_USER: ${POSTGRES_USER:-published}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-published}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CACHE_URL: redis://127.0.0.1:6379/0
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
      REDIS_URL: redis://backend:6379/0
    depends_on:
      - backend
    ports:
      - "4321:4321"

volumes:
  pgdata:
