services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-published}
      POSTGRES_USER: ${POSTGRES_USER:-published}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-published}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-published}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5436:5432"

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: ${POSTGRES_DB:-published}
      POSTGRES_USER: ${POSTGRES_USER:-published}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-published}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CACHE_URL: redis://127.0.0.1:6379/0
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODELO_PADRAO: ${AI_MODELO_PADRAO:-meta-llama/llama-3.3-70b-instruct:free}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://127.0.0.1:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      MODEL_ALIAS: ${MODEL_ALIAS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      ORCAMENTO_DIARIO: ${ORCAMENTO_DIARIO:-5}
      ORCAMENTO_MENSAL: ${ORCAMENTO_MENSAL:-30}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
      REDIS_URL: redis://backend:6379/0
    depends_on:
      - backend
    ports:
      - "4321:4321"

volumes:
  pgdata:
